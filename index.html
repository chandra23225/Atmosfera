<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Atmosfera is an interactive 3D globe weather app. Search any city and get real-time weather data visualized on a rotating Earth." />
  <title>Atmosfera | Interactive Weather Globe</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.85em' font-size='80'>A</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="topbar">
    <div class="logo">
      <span class="logo-icon">A</span>
      <span class="logo-text">Atmosfera</span>
    </div>
    <div class="search-bar">
      <input type="text" id="city-input" placeholder="Search any city..." autocomplete="off" aria-label="Search city" />
      <button id="search-btn" aria-label="Search">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="quick-strip" aria-label="Quick city shortcuts">
    <span class="quick-label">Explore</span>
    <div class="quick-list" id="quick-list"></div>
  </div>

  <div id="globe-container" role="img" aria-label="Interactive 3D Earth globe">
    <canvas id="globe-canvas"></canvas>
    <div class="spinner" id="spinner" aria-hidden="true"></div>
  </div>

  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <div class="panel" id="panel" aria-live="polite">
    <div class="panel-inner">
      <div class="city-row">
        <h2 id="p-city">--</h2>
        <span class="country" id="p-country"></span>
      </div>
      <div class="date-row" id="p-date"></div>
      <div class="weather-main">
        <span class="big-icon" id="p-icon" aria-hidden="true">--</span>
        <div>
          <div class="big-temp" id="p-temp">-- C</div>
          <div class="desc" id="p-desc">--</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="s-label">Feels like</span>
          <span class="s-val" id="p-feels">--</span>
        </div>
        <div class="stat">
          <span class="s-label">Humidity</span>
          <span class="s-val" id="p-hum">--</span>
        </div>
        <div class="stat">
          <span class="s-label">Wind</span>
          <span class="s-val" id="p-wind">--</span>
        </div>
        <div class="stat">
          <span class="s-label">Rain chance</span>
          <span class="s-val" id="p-rain">--</span>
        </div>
        <div class="stat">
          <span class="s-label">UV Index</span>
          <span class="s-val" id="p-uv">--</span>
        </div>
      </div>
      <div class="forecast" id="forecast" aria-label="5-day forecast"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
