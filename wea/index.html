<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Weather Globe</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a1a;color:#fff;overflow:hidden;display:flex;flex-direction:column}
.topbar{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem}
.logo{font-size:1.1rem;font-weight:600;color:rgba(255,255,255,0.7)}
.search-bar{display:flex;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:50px;overflow:hidden;transition:border-color .2s,background .2s}
.search-bar:focus-within{border-color:rgba(100,180,255,0.6);background:rgba(255,255,255,0.12)}
.search-bar input{background:transparent;border:none;outline:none;padding:.6rem 1.2rem;color:#fff;font-size:.95rem;width:250px}
.search-bar input::placeholder{color:rgba(255,255,255,0.35)}
.search-bar button{background:transparent;border:none;padding:0 1rem;color:rgba(255,255,255,0.6);cursor:pointer;display:flex;align-items:center;transition:color .2s}
.search-bar button:hover{color:#64b4ff}
#globe-container{flex:1;position:relative;cursor:grab}
#globe-container:active{cursor:grabbing}
#globe-canvas{width:100%;height:100%;display:block}
.panel{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:1rem 1.5rem 1.5rem;background:linear-gradient(to top,rgba(10,10,26,0.98) 65%,transparent);transform:translateY(100%);transition:transform .45s cubic-bezier(.4,0,.2,1)}
.panel.visible{transform:translateY(0)}
.panel-inner{max-width:720px;margin:0 auto}
.city-row{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.2rem}
.city-row h2{font-size:1.6rem;font-weight:600}
.city-row .country{color:rgba(255,255,255,0.4);font-size:.85rem}
.date-row{color:rgba(255,255,255,0.35);font-size:.78rem;margin-bottom:.9rem}
.weather-main{display:flex;align-items:center;gap:2rem;margin-bottom:.9rem}
.big-icon{font-size:3.8rem;line-height:1}
.big-temp{font-size:3.8rem;font-weight:200;letter-spacing:-2px;line-height:1}
.desc{color:rgba(255,255,255,0.5);text-transform:capitalize;font-size:.9rem;margin-top:.2rem}
.stats{display:flex;gap:.6rem;flex-wrap:wrap}
.stat{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:.55rem .9rem;display:flex;flex-direction:column;gap:.1rem;min-width:78px;transition:background .2s}
.stat:hover{background:rgba(255,255,255,0.1)}
.stat .s-label{font-size:.62rem;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:.06em}
.stat .s-val{font-size:.9rem;font-weight:500}
.forecast{display:flex;gap:.5rem;margin-top:.9rem;overflow-x:auto;padding-bottom:.2rem;scrollbar-width:none}
.forecast::-webkit-scrollbar{display:none}
.fc-day{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:.55rem .75rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:60px;cursor:default;transition:background .2s,border-color .2s}
.fc-day:hover{background:rgba(100,180,255,0.08);border-color:rgba(100,180,255,0.25)}
.fc-day .fc-name{font-size:.68rem;color:rgba(255,255,255,0.38)}
.fc-day .fc-icon{font-size:1.3rem}
.fc-day .fc-hi{font-size:.82rem;font-weight:500}
.fc-day .fc-lo{font-size:.72rem;color:rgba(255,255,255,0.32)}
.toast{position:absolute;top:70px;left:50%;transform:translateX(-50%) translateY(-8px);background:rgba(255,80,80,0.12);border:1px solid rgba(255,80,80,0.3);border-radius:50px;padding:.45rem 1.1rem;font-size:.82rem;color:#ff8080;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spinner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;border:2px solid rgba(255,255,255,0.08);border-top-color:#64b4ff;border-radius:50%;animation:spin .7s linear infinite;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
.spinner.show{opacity:1}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">🌐 WeatherGlobe</div>
  <div class="search-bar">
    <input type="text" id="city-input" placeholder="Search any city..." autocomplete="off"/>
    <button id="search-btn">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
      </svg>
    </button>
  </div>
</div>

<div id="globe-container">
  <canvas id="globe-canvas"></canvas>
  <div class="spinner" id="spinner"></div>
</div>
<div class="toast" id="toast"></div>

<div class="panel" id="panel">
  <div class="panel-inner">
    <div class="city-row"><h2 id="p-city">--</h2><span class="country" id="p-country"></span></div>
    <div class="date-row" id="p-date"></div>
    <div class="weather-main">
      <span class="big-icon" id="p-icon">🌤️</span>
      <div>
        <div class="big-temp" id="p-temp">--°C</div>
        <div class="desc" id="p-desc">--</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="s-label">Feels like</span><span class="s-val" id="p-feels">--</span></div>
      <div class="stat"><span class="s-label">Humidity</span><span class="s-val" id="p-hum">--</span></div>
      <div class="stat"><span class="s-label">Wind</span><span class="s-val" id="p-wind">--</span></div>
      <div class="stat"><span class="s-label">Rain chance</span><span class="s-val" id="p-rain">--</span></div>
      <div class="stat"><span class="s-label">UV Index</span><span class="s-val" id="p-uv">--</span></div>
    </div>
    <div class="forecast" id="forecast"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var DAYS  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// WMO weather code → label + emoji
function wmoInfo(code) {
  if (code === 0)              return {label:'Clear sky',        icon:'☀️'};
  if (code <= 2)               return {label:'Partly cloudy',    icon:'⛅'};
  if (code === 3)              return {label:'Overcast',         icon:'☁️'};
  if (code <= 49)              return {label:'Foggy',            icon:'🌫️'};
  if (code <= 57)              return {label:'Drizzle',          icon:'🌦️'};
  if (code <= 67)              return {label:'Rain',             icon:'🌧️'};
  if (code <= 77)              return {label:'Snow',             icon:'❄️'};
  if (code <= 82)              return {label:'Rain showers',     icon:'🌧️'};
  if (code <= 86)              return {label:'Snow showers',     icon:'🌨️'};
  if (code <= 99)              return {label:'Thunderstorm',     icon:'⛈️'};
  return {label:'Unknown', icon:'🌡️'};
}

// ── GEOCODE (Nominatim, free) ─────────────────────────────────────────────────
async function geocode(query) {
  var r = await fetch(
    'https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(query)+'&format=json&limit=1&addressdetails=1',
    {headers:{'Accept-Language':'en'}}
  );
  var d = await r.json();
  if (!d.length) return null;
  var addr = d[0].address || {};
  return {
    lat:     parseFloat(d[0].lat),
    lon:     parseFloat(d[0].lon),
    city:    addr.city || addr.town || addr.village || addr.county || d[0].display_name.split(',')[0],
    country: addr.country_code ? addr.country_code.toUpperCase() : ''
  };
}

// ── OPEN-METEO (free, no key) ─────────────────────────────────────────────────
async function fetchWeather(lat, lon) {
  var url = 'https://api.open-meteo.com/v1/forecast'
    + '?latitude='+lat+'&longitude='+lon
    + '&current=temperature_2m,apparent_temperature,relative_humidity_2m,'
    + 'wind_speed_10m,weather_code,uv_index,precipitation_probability'
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'
    + '&timezone=auto&forecast_days=6';
  var r = await fetch(url);
  return r.json();
}

// ── THREE.JS GLOBE ────────────────────────────────────────────────────────────
var container = document.getElementById('globe-container');
var canvas    = document.getElementById('globe-canvas');
var renderer  = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:true});
renderer.setPixelRatio(window.devicePixelRatio);

var scene  = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.z = 2.8;

var texLoader = new THREE.TextureLoader();
var globeMesh = new THREE.Mesh(
  new THREE.SphereGeometry(1, 64, 64),
  new THREE.MeshPhongMaterial({
    map:      texLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'),
    specular: new THREE.Color(0x111111),
    shininess: 10
  })
);
scene.add(globeMesh);

// Atmosphere
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(1.025, 64, 64),
  new THREE.MeshPhongMaterial({color:0x3399ff, transparent:true, opacity:0.06, side:THREE.FrontSide, depthWrite:false})
));

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
var sunLight = new THREE.DirectionalLight(0xffffff, 1.1);
sunLight.position.set(5, 3, 5);
scene.add(sunLight);

// Pin
var pinMesh = new THREE.Mesh(
  new THREE.SphereGeometry(0.022, 16, 16),
  new THREE.MeshBasicMaterial({color:0x64b4ff})
);
pinMesh.visible = false;
scene.add(pinMesh);

var ringMesh = new THREE.Mesh(
  new THREE.RingGeometry(0.033, 0.053, 32),
  new THREE.MeshBasicMaterial({color:0x64b4ff, transparent:true, opacity:0.6, side:THREE.DoubleSide})
);
ringMesh.visible = false;
scene.add(ringMesh);

function resize() {
  var w = container.clientWidth, h = container.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

// ── DRAG ──────────────────────────────────────────────────────────────────────
var drag = false, lastMouse = {x:0,y:0}, autoSpin = true;

function startDrag(x,y){ drag=true; autoSpin=false; lastMouse={x:x,y:y}; }
function moveDrag(x,y){
  if(!drag) return;
  globeMesh.rotation.y += (x-lastMouse.x)*0.005;
  globeMesh.rotation.x += (y-lastMouse.y)*0.005;
  globeMesh.rotation.x = Math.max(-1.2, Math.min(1.2, globeMesh.rotation.x));
  lastMouse={x:x,y:y};
}
canvas.addEventListener('mousedown', function(e){ startDrag(e.clientX,e.clientY); });
window.addEventListener('mouseup',   function(){ drag=false; });
window.addEventListener('mousemove', function(e){ moveDrag(e.clientX,e.clientY); });
canvas.addEventListener('touchstart', function(e){ startDrag(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
canvas.addEventListener('touchend',   function(){ drag=false; });
canvas.addEventListener('touchmove',  function(e){ moveDrag(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});

// ── FLY-TO ────────────────────────────────────────────────────────────────────
// The globe texture maps:
//   lon=0   → front face when rotation.y = 0  (but Three sphere starts at lon=-180 at front)
//   So to bring lon to front: rotation.y = -lon * PI/180
//   To bring lat to center:   rotation.x =  lat * PI/180  (positive lat = tilt up)

var flyAnim = null;

function shortAngle(from, to) {
  // Normalise difference to [-PI, PI]
  var d = ((to - from) % (2*Math.PI) + 3*Math.PI) % (2*Math.PI) - Math.PI;
  return from + d;
}

function flyTo(lat, lon) {
  // Target globe rotation so (lat,lon) faces the camera
  var targetX =  lat * (Math.PI / 180);   // tilt globe so lat faces camera
  var targetY = -lon * (Math.PI / 180);   // spin globe so lon faces camera

  var fromX = globeMesh.rotation.x;
  var fromY = globeMesh.rotation.y;
  var toX   = targetX;
  var toY   = shortAngle(fromY, targetY); // shortest arc

  flyAnim = {fromX:fromX, fromY:fromY, toX:toX, toY:toY, t:0, dur:1.8};

  // Place pin at correct surface position (in globe-local space)
  var phi   = (90 - lat)  * Math.PI / 180;
  var theta = (lon + 180) * Math.PI / 180;
  var px = -Math.sin(phi)*Math.cos(theta);
  var py =  Math.cos(phi);
  var pz =  Math.sin(phi)*Math.sin(theta);
  pinMesh.position.set(px*1.015, py*1.015, pz*1.015);
  ringMesh.position.set(px*1.015, py*1.015, pz*1.015);
  pinMesh.visible  = true;
  ringMesh.visible = true;
}

// ── ANIMATE ───────────────────────────────────────────────────────────────────
var clock = new THREE.Clock();
function ease(t){ return t<0.5?2*t*t:-1+(4-2*t)*t; }

(function animate(){
  requestAnimationFrame(animate);
  var dt = clock.getDelta();

  if (flyAnim) {
    flyAnim.t = Math.min(1, flyAnim.t + dt/flyAnim.dur);
    var e = ease(flyAnim.t);
    globeMesh.rotation.x = flyAnim.fromX + (flyAnim.toX - flyAnim.fromX)*e;
    globeMesh.rotation.y = flyAnim.fromY + (flyAnim.toY - flyAnim.fromY)*e;
    if (flyAnim.t >= 1) flyAnim = null;
  } else if (autoSpin && !drag) {
    globeMesh.rotation.y += dt * 0.07;
  }

  // Pin + ring follow globe rotation
  if (pinMesh.visible) {
    pinMesh.rotation.copy(globeMesh.rotation);
    ringMesh.rotation.copy(globeMesh.rotation);
    ringMesh.material.opacity = 0.3 + 0.35*Math.sin(Date.now()*0.003);
  }

  renderer.render(scene, camera);
})();

// ── UI ────────────────────────────────────────────────────────────────────────
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},3000);
}
function loading(on){ document.getElementById('spinner').classList.toggle('show',on); }

function renderPanel(geo, weather) {
  var cur    = weather.current;
  var daily  = weather.daily;
  var info   = wmoInfo(cur.weather_code);

  document.getElementById('p-city').textContent   = geo.city;
  document.getElementById('p-country').textContent= geo.country;
  document.getElementById('p-date').textContent   = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  document.getElementById('p-temp').textContent   = Math.round(cur.temperature_2m)+'°C';
  document.getElementById('p-icon').textContent   = info.icon;
  document.getElementById('p-desc').textContent   = info.label;
  document.getElementById('p-feels').textContent  = Math.round(cur.apparent_temperature)+'°C';
  document.getElementById('p-hum').textContent    = cur.relative_humidity_2m+'%';
  document.getElementById('p-wind').textContent   = Math.round(cur.wind_speed_10m)+' km/h';
  document.getElementById('p-rain').textContent   = (cur.precipitation_probability||0)+'%';
  document.getElementById('p-uv').textContent     = cur.uv_index != null ? cur.uv_index : '--';

  // 5-day forecast (skip today = index 0)
  var fc = document.getElementById('forecast');
  fc.innerHTML = '';
  for (var i = 1; i <= 5; i++) {
    if (!daily.time[i]) break;
    var d   = new Date(daily.time[i]+'T12:00:00');
    var inf = wmoInfo(daily.weather_code[i]);
    var div = document.createElement('div');
    div.className = 'fc-day';
    div.innerHTML = '<span class="fc-name">'+DAYS[d.getDay()]+'</span>'
      +'<span class="fc-icon">'+inf.icon+'</span>'
      +'<span class="fc-hi">'+Math.round(daily.temperature_2m_max[i])+'°</span>'
      +'<span class="fc-lo">'+Math.round(daily.temperature_2m_min[i])+'°</span>';
    fc.appendChild(div);
  }

  document.getElementById('panel').classList.add('visible');
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
async function handleSearch() {
  var query = document.getElementById('city-input').value.trim();
  if (!query) return;
  loading(true);
  try {
    var geo = await geocode(query);
    if (!geo) { toast('City not found'); loading(false); return; }

    var weather = await fetchWeather(geo.lat, geo.lon);
    flyTo(geo.lat, geo.lon);
    renderPanel(geo, weather);
  } catch(err) {
    toast('Something went wrong');
    console.error(err);
  }
  loading(false);
}

document.getElementById('search-btn').addEventListener('click', handleSearch);
document.getElementById('city-input').addEventListener('keydown', function(e){ if(e.key==='Enter') handleSearch(); });

// Hint
setTimeout(function(){
  var h = document.createElement('div');
  h.style.cssText='position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.22);font-size:.78rem;pointer-events:none;z-index:5;text-align:center;transition:opacity 1s';
  h.textContent='🌐 Drag to rotate · Search any city';
  container.appendChild(h);
  setTimeout(function(){ h.style.opacity='0'; setTimeout(function(){h.remove();},1000); },4000);
},800);
</script>
</body>
</html>
